spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/markerit}
    username: ${SPRING_DATASOURCE_USERNAME:markerit}
    password: ${SPRING_DATASOURCE_PASSWORD:markerit_dev}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
app:
  security:
    jwt-secret: ${JWT_SECRET:markerit-local-development-secret-please-change-this}
    jwt-lifetime: ${JWT_LIFETIME:PT12H}
    auth-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT15M}
    email-otp-pepper: ${EMAIL_OTP_PEPPER:markerit-local-otp-pepper-change-this-before-production-please}
  email:
    provider: ${EMAIL_PROVIDER:smtp}
    from: ${EMAIL_FROM:noreply@markerit.local}
    resend-api-key: ${RESEND_API_KEY:}
    resend-api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  storage:
    provider: ${STORAGE_PROVIDER:S3}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:${R2_ACCESS_KEY_ID:minioadmin}}
    secret-key: ${S3_SECRET_KEY:${R2_SECRET_ACCESS_KEY:minioadmin}}
    bucket: ${S3_BUCKET:${R2_BUCKET:markerit}}
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:true}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/markerit}
    local-directory: ${LOCAL_STORAGE_DIR:${java.io.tmpdir}/markerit-storage}
