spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/markerit}
    username: ${SPRING_DATASOURCE_USERNAME:markerit}
    password: ${SPRING_DATASOURCE_PASSWORD:markerit_dev}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
app:
  security:
    jwt-secret: ${JWT_SECRET:markerit-local-development-secret-please-change-this}
    jwt-lifetime: ${JWT_LIFETIME:PT12H}
    auth-cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
      window: ${LOGIN_RATE_LIMIT_WINDOW:PT15M}
