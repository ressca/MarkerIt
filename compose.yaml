services:
  install:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: sh -c "pnpm config set store-dir /pnpm/store && pnpm install --frozen-lockfile"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: pnpm nx dev app --hostname 0.0.0.0 --port 3000
    depends_on:
      install:
        condition: service_completed_successfully
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    init: true

  landing:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: pnpm nx dev landing --hostname 0.0.0.0 --port 3001
    depends_on:
      install:
        condition: service_completed_successfully
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    init: true

  api:
    image: gradle:8.14-jdk21
    working_dir: /workspace/apps/api
    command: ["sh", "scripts/dev.sh"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      GRADLE_USER_HOME: /home/gradle/.gradle
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - gradle_cache:/home/gradle/.gradle
    init: true

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-markerit}
      POSTGRES_USER: ${POSTGRES_USER:-markerit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markerit_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  node_modules:
  pnpm_store:
  gradle_cache:
  postgres_data:
