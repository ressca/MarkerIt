services:
  install:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: sh -c "pnpm config set store-dir /pnpm/store && pnpm install --frozen-lockfile"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - pnpm_store:/pnpm/store

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: pnpm --filter @markerit/app exec next dev --hostname 0.0.0.0 --port 3000
    depends_on:
      install:
        condition: service_completed_successfully
    environment:
      WATCHPACK_POLLING: "true"
      AUTH_API_INTERNAL_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    init: true

  landing:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: pnpm --filter @markerit/landing exec next dev --hostname 0.0.0.0 --port 3001
    depends_on:
      install:
        condition: service_completed_successfully
    environment:
      WATCHPACK_POLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    init: true

  api:
    image: gradle:8.14-jdk21
    working_dir: /workspace/apps/api
    command: ["sh", "scripts/dev.sh"]
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      GRADLE_USER_HOME: /home/gradle/.gradle
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-markerit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-markerit}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-markerit_dev}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_OTP_PEPPER: ${EMAIL_OTP_PEPPER:-markerit-local-otp-pepper-change-this-before-production-please}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@markerit.local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-S3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-markerit}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/markerit}
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - gradle_cache:/home/gradle/.gradle
    init: true

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

  # MinIO stopped publishing official Docker images; use pinned community mirrors.
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-markerit}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-markerit}
      POSTGRES_USER: ${POSTGRES_USER:-markerit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markerit_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  node_modules:
  pnpm_store:
  gradle_cache:
  postgres_data:
  minio_data:
